name: Build

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      checkout_ref:
        description: Optional commit, tag, or branch to build
        type: string
    outputs:
      artifact_name:
        description: Name of the uploaded JAR artifact
        value: ${{ jobs.build.outputs.artifact_name }}
      mod_name:
        description: Display name of the built mod
        value: ${{ jobs.build.outputs.mod_name }}

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      artifact_name: ${{ steps.project.outputs.artifact_name }}
      mod_name: ${{ steps.project.outputs.mod_name }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          persist-credentials: false

      - name: Read project metadata
        id: project
        run: bash .github/scripts/read-project-metadata.sh

      - name: Set up JDK ${{ steps.project.outputs.java_version }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ steps.project.outputs.java_version }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build and test
        id: build
        run: ./gradlew build --stacktrace

      - name: Upload build artifacts
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.project.outputs.artifact_name }}
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Add build summary
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
          MOD_NAME: ${{ steps.project.outputs.mod_name }}
          MOD_VERSION: ${{ steps.project.outputs.mod_version }}
          MINECRAFT_VERSION: ${{ steps.project.outputs.minecraft_version }}
          JAVA_VERSION: ${{ steps.project.outputs.java_version }}
          GRADLE_VERSION: ${{ steps.project.outputs.gradle_version }}
          SHORT_SHA: ${{ steps.project.outputs.short_sha }}
          ARTIFACT_NAME: ${{ steps.project.outputs.artifact_name }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: bash .github/scripts/write-build-summary.sh
